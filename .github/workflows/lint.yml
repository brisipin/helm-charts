name: Lint charts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render every chart with every cluster's values
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            name="$(basename "$chart")"
            helm lint "$chart"
            helm template "$name" "$chart" > /dev/null
            for values in clusters/*/"$name".values.yaml; do
              [ -e "$values" ] || continue
              echo "Rendering $name with $values"
              helm lint "$chart" -f "$values"
              helm template "$name" "$chart" -f "$values" > /dev/null
            done
          done

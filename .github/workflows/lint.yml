name: Lint charts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HELMFILE_VERSION: 1.8.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up helmfile
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" helmfile
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint and render every cluster's releases
        run: |
          set -euo pipefail
          # Real secret files are gitignored; stand in the committed examples.
          for example in clusters/*/*.secret.example.yaml; do
            [ -e "$example" ] || continue
            cp "$example" "${example%.example.yaml}.yaml"
          done
          for dir in clusters/*/; do
            env="$(basename "$dir")"
            echo "::group::$env"
            helmfile -e "$env" lint
            helmfile -e "$env" template > /dev/null
            echo "::endgroup::"
          done

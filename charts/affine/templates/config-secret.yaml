{{- /* config.json is a Secret, not a ConfigMap: with storage.type=s3 it carries the bucket credentials. */}}
{{- $config := dict "server" (dict "name" .Values.server.name "externalUrl" .Values.server.externalUrl) }}
{{- if eq .Values.storage.type "s3" }}
{{- $s3 := .Values.storage.s3 }}
{{- $s3Config := dict "region" (required "storage.s3.region is required when storage.type=s3" $s3.region) }}
{{- if $s3.endpoint }}
{{- $_ := set $s3Config "endpoint" $s3.endpoint }}
{{- $_ := set $s3Config "forcePathStyle" $s3.forcePathStyle }}
{{- end }}
{{- if $s3.accessKeyId }}
{{- $_ := set $s3Config "credentials" (dict "accessKeyId" $s3.accessKeyId "secretAccessKey" $s3.secretAccessKey) }}
{{- end }}
{{- $storages := dict "blob.storage" (dict "provider" "aws-s3" "bucket" (required "storage.s3.bucket is required when storage.type=s3" $s3.bucket) "config" $s3Config) }}
{{- if $s3.avatarBucket }}
{{- $_ := set $storages "avatar.storage" (dict "provider" "aws-s3" "bucket" $s3.avatarBucket "config" $s3Config) }}
{{- end }}
{{- $_ := set $config "storages" $storages }}
{{- else if ne .Values.storage.type "fs" }}
{{- fail "storage.type must be fs or s3" }}
{{- end }}
{{- $config = mustMergeOverwrite $config (deepCopy .Values.config) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "affine.fullname" . }}-config
  labels:
    {{- include "affine.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: |
    {{- $config | toPrettyJson | nindent 4 }}

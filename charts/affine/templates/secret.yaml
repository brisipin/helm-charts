{{- if not .Values.secret.existingSecret }}
{{- $name := include "affine.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}

{{- /* Generated values are read back from the live Secret so upgrades keep them. */}}
{{- $privateKey := .Values.secret.privateKey }}
{{- if not $privateKey }}
{{- $privateKey = (get $existing "AFFINE_PRIVATE_KEY" | default "" | b64dec) | default (genPrivateKey "ecdsa") }}
{{- end }}

{{- $pgPassword := .Values.postgres.password }}
{{- if and .Values.postgres.enabled (not $pgPassword) }}
{{- $pgPassword = (get $existing "POSTGRES_PASSWORD" | default "" | b64dec) | default (randAlphaNum 32) }}
{{- end }}

{{- $databaseUrl := "" }}
{{- if .Values.postgres.enabled }}
{{- $databaseUrl = printf "postgresql://affine:%s@%s-postgres:5432/affine" (urlquery $pgPassword) $name }}
{{- else }}
{{- $databaseUrl = required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "affine.labels" . | nindent 4 }}
type: Opaque
stringData:
  AFFINE_PRIVATE_KEY: {{ $privateKey | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  {{- end }}
  {{- if .Values.mailer.enabled }}
  MAILER_PASSWORD: {{ .Values.mailer.password | quote }}
  {{- end }}
{{- end }}

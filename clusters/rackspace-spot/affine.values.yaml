# Rackspace Spot cloudspace (kube context: the-mill-tee-bot-dev-oidc).
#
# First-deploy shape: everything in-cluster on Cinder volumes, reachable by
# port-forward only. Nodes are spot instances (gp.5.2.4, ~1.5 CPU / 2.7Gi
# allocatable each), so requests are kept small and Postgres has no
# off-cluster backup yet.

server:
  # Change to the public URL once ingress or a tunnel exists.
  externalUrl: http://localhost:3010

persistence:
  storageClass: ssdv2-performance
  size: 10Gi

postgres:
  persistence:
    storageClass: ssdv2-performance
    size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi
